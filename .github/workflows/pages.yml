name: Deploy website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - config.yaml
      - changelogs/**
      - releases/**
      - tables/**
      - website/**
      - .github/workflows/pages.yml
  # Pushes made by the update workflow use GITHUB_TOKEN and therefore don't
  # trigger the push event above.
  workflow_run:
    workflows: [Update changelogs]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; newer runs wait and deploy the latest state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
